# CI: يستخدم سر SUPABASE_PUBLISHABLE_KEY لتوفير متغيرات Supabase العامة أثناء البناء.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: فحص الأسرار (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks على كل السجل
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  checks:
    name: فحوصات الجودة
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: توفير متغيرات Supabase العامة للبناء
        run: |
          cat > .env <<EOF
          SUPABASE_PROJECT_ID="iniqospdljdlcfmwxafl"
          SUPABASE_URL="https://iniqospdljdlcfmwxafl.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
          VITE_SUPABASE_PROJECT_ID="iniqospdljdlcfmwxafl"
          VITE_SUPABASE_URL="https://iniqospdljdlcfmwxafl.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
          EOF
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: تطابق رقم الإصدار (CHANGELOG وpackage.json وbuild.gradle)
        run: node scripts/version.mjs --check

      - name: تطابق نسخ دوال Edge المشتركة مع أصولها
        run: node scripts/check-shared-mirror.mjs

      - name: فحص الأنواع
        run: npm run typecheck

      - name: فحص الجودة والتنسيق
        run: npm run lint

      - name: اختبارات محرّك الاختبارات (وحدات)
        run: npm run test:unit

      - name: اليوم المحلي في مناطق زمنية بعيدة عن UTC (تدقيق 1.1)
        run: npm run test:tz

      - name: تقدّم الترجمة — لا يزيد النص العربي المكتوب مباشرة (تدقيق 4.1)
        run: |
          npm run -s check:i18n
          node scripts/i18n-progress.mjs --summary >> "$GITHUB_STEP_SUMMARY"

      - name: بناء حزمة تطبيق Android (المصحف مضمَّن)
        run: npm run build

      - name: ميزانية حجم الحزمة (الأولى ≤ 238KB gzip، والقطعة الكسولة ≤ 400KB)
        run: npm run check:bundle

      - name: اختبارات قاعدة البيانات والترحيلات
        run: npm run test:db

      - name: تطابق أنواع قاعدة البيانات مع الترحيلات
        run: npm run check:types-fresh

  android-unit:
    name: اختبارات Android (JUnit) وبناء التصحيح
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: تثبيت الحزم
        run: npm ci

      - name: توفير متغيرات Supabase العامة للبناء
        run: |
          cat > .env <<EOF
          SUPABASE_PROJECT_ID="iniqospdljdlcfmwxafl"
          SUPABASE_URL="https://iniqospdljdlcfmwxafl.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
          VITE_SUPABASE_PROJECT_ID="iniqospdljdlcfmwxafl"
          VITE_SUPABASE_URL="https://iniqospdljdlcfmwxafl.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
          EOF
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: بناء الحزمة المضمَّنة ومزامنة Capacitor
        run: npm run build:apk-web

      - name: JUnit وبناء APK للتصحيح
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: رفع تقارير JUnit عند الإخفاق
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-reports
          path: android/app/build/reports/tests
          retention-days: 7

  e2e:
    name: اختبارات E2E (حزمة Android في Chrome بمقاس Pixel 7)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: ذاكرة متصفحات Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium

      - name: تشغيل E2E
        run: npm run test:e2e

      - name: رفع التقرير عند الإخفاق
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
