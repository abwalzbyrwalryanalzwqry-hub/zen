# قفل التطبيق 1.29.0: اختبارات مُجهَّزة على محاكي Android (Keystore الحقيقي لخزنة PIN).
# المحاكي يعتمد على KVM في مشغّلات GitHub، وقد يتأخر إقلاعه (مهلة 20 دقيقة).
# لا تعمل إلا حين يتغيّر كود Android أو يدوياً، لأن تشغيل المحاكي أبطأ وأغلى من فحوصات CI العادية.
name: Android Instrumented

# يدوي فقط: إقلاع المحاكي على مشغّلات GitHub المجانية غير مستقر (تجاوز مهلة الإقلاع في تجارب طلب الدمج #209)،
# فلا يُترك فحصاً أحمر على كل طلب. شغّله من تبويب Actions قبل الإصدار أو بعد تغيير PinVault.
on:
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: محاكي API 29
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء الحزمة المضمَّنة ومزامنة Capacitor
        run: npm run build:apk-web

      # KVM لتسريع المحاكي على مشغّلات Linux
      - name: تفعيل KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: الاختبارات على المحاكي
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 29 بصورة default: الأخف إقلاعاً على مشغّلات GitHub، وKeystore (HMAC) فيه كامل.
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_3a
          ram-size: 3072M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest > ../instrumented.log 2>&1 || (tail -n 60 ../instrumented.log; exit 1)

      # الأخطاء ملاحظات (annotations) مقروءة في صفحة الطلب دون تنزيل السجلّ أو المرفقات.
      - name: ملخّص الإخفاق
        if: failure()
        run: |
          if [ -f instrumented.log ]; then
            grep -E "FAILED|What went wrong|Exception|Error:|> Task .*FAILED|INSTRUMENTATION_|tests completed" instrumented.log | head -n 25 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          for f in android/app/build/outputs/androidTest-results/connected/**/*.xml android/app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] || continue
            grep -oE '<testcase [^>]*name="[^"]*"|<failure message="[^"]{0,300}' "$f" | head -n 20 | while IFS= read -r l; do echo "::error::${l}"; done
          done

      - name: رفع التقارير عند الإخفاق
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-reports
          path: android/app/build/reports/androidTests
          retention-days: 7
