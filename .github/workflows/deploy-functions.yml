name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy zen-tools
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy zen-tools --project-ref iniqospdljdlcfmwxafl

      - name: Deploy zen-recitation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy zen-recitation --project-ref iniqospdljdlcfmwxafl

      # المجدول ومشغّل push_outbox يرسلان سرّاً لا رمز JWT، والدالة تتحقق بنفسها (السرّ أو جلسة المستخدم)،
      # فيلزم --no-verify-jwt. كانت تُنشر يدوياً فقط، فلا يصل أي إصلاح في _shared/push-core أو fcm.server.
      - name: Deploy zen-push-dispatch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy zen-push-dispatch --no-verify-jwt --project-ref iniqospdljdlcfmwxafl
