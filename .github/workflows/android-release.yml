# بناء إصدار Android موقَّع (المرحلة 6.7): عند وسم v* أو يدوياً.
# - رقم الإصدار من CHANGELOG (scripts/version.mjs)، وversionCode من رقم التشغيل + 100 فيزيد دائماً.
# - المفتاح وgoogle-services.json من الأسرار ولا يُحفظان في Git ولا في المرفقات.
# - AAB وAPK مرفقان للتشغيل، وAAB إلى المسار الداخلي في Google Play إن وُجد PLAY_SERVICE_ACCOUNT_JSON.
# الأسرار (docs/PLAY_STORE.md): ANDROID_KEYSTORE_BASE64 وANDROID_KEYSTORE_PASSWORD وANDROID_KEY_ALIAS
# وANDROID_KEY_PASSWORD (اختياري، الافتراضي كلمة المخزن)، وGOOGLE_SERVICES_JSON وPLAY_SERVICE_ACCOUNT_JSON (اختياريان).
name: إصدار Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # المستودع العام: أسرار التوقيع وPlay في البيئة `production` بموافقة إلزامية من المالك وفروع/وسوم مقيّدة
    # (docs/PUBLIC_REPO.md). قبل نقل الأسرار إليها تبقى أسرار المستودع تعمل كما هي.
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: تثبيت الحزم
        run: npm ci

      - name: رقم الإصدار (CHANGELOG) وversionCode
        run: |
          export VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          node scripts/version.mjs
          node scripts/version.mjs --check
          NAME=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$NAME" ]; then
            echo "::error::الوسم ${GITHUB_REF_NAME} لا يطابق إصدار CHANGELOG ($NAME)."
            exit 1
          fi

      - name: مفتاح التوقيع وgoogle-services.json
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::أسرار التوقيع غير مضبوطة (ANDROID_KEYSTORE_BASE64 وANDROID_KEYSTORE_PASSWORD وANDROID_KEY_ALIAS)."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/zen-release.jks
          {
            echo "storeFile=zen-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/keystore.properties
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::لا GOOGLE_SERVICES_JSON: يُبنى التطبيق بلا إشعارات FCM."
          fi

      - name: بناء نسخة الويب المضمَّنة
        env:
          # رابط QR الشهائد العام (1.23.0): vars.PUBLIC_VERIFY_URL، أو صفحة verify/ في الموقع العام إن ضُبط
          # LEGAL_SITE_REPO. بلا أيّهما يبقى الرابط zen://verify (يفتح التطبيق وحده).
          PUBLIC_VERIFY_URL: ${{ vars.PUBLIC_VERIFY_URL }}
          LEGAL_SITE_REPO: ${{ vars.LEGAL_SITE_REPO }}
        run: |
          if [ -z "$PUBLIC_VERIFY_URL" ] && [ -n "$LEGAL_SITE_REPO" ]; then
            PUBLIC_VERIFY_URL="https://${LEGAL_SITE_REPO%%/*}.github.io/${LEGAL_SITE_REPO#*/}/verify/"
          fi
          export VITE_PUBLIC_VERIFY_URL="$PUBLIC_VERIFY_URL"
          npm run build:apk-web

      - name: بناء AAB وAPK
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: التحقق من التوقيع
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -5
          mkdir -p out
          cp "$APK" "out/zen-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/zen-${VERSION_NAME}-vc${VERSION_CODE}.aab"
          (cd out && sha256sum * > SHA256SUMS)

      - name: حذف المفتاح من القرص
        if: always()
        run: rm -f android/zen-release.jks android/keystore.properties android/app/google-services.json

      - uses: actions/upload-artifact@v7
        id: artifact
        continue-on-error: true
        with:
          name: zen-android-${{ env.VERSION_NAME }}-vc${{ env.VERSION_CODE }}
          path: out/
          retention-days: 30

      # احتياط حصة المرفقات: APK وAAB في إصدار مسودة خاص بالمستودع (لا يُنشر ولا يظهر لغير المتعاونين).
      - name: حفظ الحزم في إصدار مسودة (احتياط الحصة)
        if: steps.artifact.outcome == 'failure' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-v${VERSION_NAME}-vc${VERSION_CODE}"
          gh release create "$TAG" out/* --draft --target "$GITHUB_SHA" \
            --title "زِن $VERSION_NAME (versionCode $VERSION_CODE)" --notes "بناء يدوي؛ حصة مرفقات Actions ممتلئة."
          echo "الحزم في الإصدار المسودة \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

      - name: مرفقات الإصدار في GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" out/* --title "زِن $VERSION_NAME" --notes "$NOTES" --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: التحقق من حساب Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: الرفع إلى المسار الداخلي في Google Play
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.zen.quran
          releaseFiles: out/*.aab
          track: internal
          # draft حتى يكتمل إعداد التطبيق في Play Console؛ ثم PLAY_RELEASE_STATUS=completed.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
